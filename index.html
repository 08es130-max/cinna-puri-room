 cv.className='hidecanvas';

 const hud=document.createElement('div');
 hud.className='hidehud';
 hud.innerHTML=
  '<span class="hideicons">'+
   '<img class="hideicon" data-i="cinna" src="./assets/cinnamoroll.webp" alt="しなもろーる">'+
   '<img class="hideicon" data-i="puri" src="./assets/pompompurin.webp" alt="ぽむぽむぷりん">'+
  '</span>';

 const hint=document.createElement('div');
 hint.className='hidehint';

 function updateHideHud(){
  const cinnaIcon=hud.querySelector('.hideicon[data-i="cinna"]');
  const puriIcon=hud.querySelector('.hideicon[data-i="puri"]');
  if(cinnaIcon)cinnaIcon.classList.toggle('on',found.cinna);
  if(puriIcon)puriIcon.classList.toggle('on',found.puri);
 }

 const im=new Image();
 im.onload=()=>{
  cv.width=im.naturalWidth;
  cv.height=im.naturalHeight;
  cv.getContext('2d').drawImage(im,0,0);
 };
 im.src='./assets/'+scenes[sceneIndex]+'?v=0866';

 updateHideHud();

 const markFound=(who,t)=>{
  found[who]=true;
  count++;
  updateHideHud();

  const mark=document.createElement('div');
  mark.className='hidecircle';
  mark.style.left=(t.x*100)+'%';
  mark.style.top=(t.y*100)+'%';
  mark.textContent='✓';
  wrap.appendChild(mark);

  if(count===2){
   hint.textContent='ふたりとも みつけたよ！';
   start.style.display='';
   start.textContent='もういちど';
   start.disabled=false;
  }else{
   hint.textContent='あと ひとり！';
  }
 };

 cv.onclick=e=>{
  const r=cv.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width;
  const ny=(e.clientY-r.top)/r.height;

  let hit=false;
  for(const who of ['cinna','puri']){
   if(found[who])continue;

   const t=target[who],rx=.14,ry=.16;
   const d=((nx-t.x)/rx)**2+((ny-t.y)/ry)**2;

   if(d<=1){
    markFound(who,t);
    hit=true;
    break;
   }
  }

  if(!hit&&count<2){
   hint.textContent=count?'もうひとりを さがしてね！':'もうすこし さがしてみてね！';
  }
 };
}

extContent=h<10?'おはよう。ふたりもおきてきました。':h>=20?'よるのおへや。ふたりともちょっとねむそうです。':'ふたりともげんきにすごしています。';const APP_VERSION='0.8.70',APP_CACHE='0870';let appReloading=false;
