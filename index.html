<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='cinna-puri-v031';let st=JSON.parse(localStorage.getItem(KEY)||'{"coins":30,"f":{"cinna":0,"puri":0},"wear":"✨"}'),who='cinna',timer=null,score=0,sec=15;const save=()=>localStorage.setItem(KEY,JSON.stringify(st));function render(){coins.textContent=st.coins;for(const c of ['cinna','puri']){let v=st.f[c],s=c==='cinna'?'c':'p';$('#l'+s).textContent='れべる '+(Math.floor(v/50)+1);$('#b'+s).style.width=((v%50)/50*100)+'%'}}function add(c,n){st.f[c]+=n;save();render()}function say(t){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),2000)}$$('.nav').forEach(b=>b.onclick=()=>{$$('.nav').forEach(x=>x.classList.toggle('active',x===b));$$('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});$$('[data-go]').forEach(b=>b.onclick=()=>$('.nav[data-tab="'+b.dataset.go+'"]').click());$$('.char').forEach(b=>b.onclick=()=>{let c=b.dataset.char;say(c==='cinna'?'しなもろーる「よんだ？ いっしょにあそぼう♪」':'ポムポムぷりん「どうしたの〜？ おやつたべる？」');add(c,1)});food.onclick=()=>{mealpick.classList.add('show')};$('.mealfood').forEach(b=>b.onclick=()=>{mealpick.classList.remove('show');let fx=document.createElement('div');fx.className='foodfx';fx.textContent=b.dataset.food;$('.room').appendChild(fx);cinnaImg.style.transform='scale(1.04) translateY(3px)';puriImg.style.transform='scale(1.04) translateY(3px)';setTimeout(()=>{cinnaImg.style.transform='';puriImg.style.transform=''},700);setTimeout(()=>fx.remove(),1200);add('cinna',2);add('puri',2);say(b.dataset.name+'を もぐもぐ。おいしいね！')});snack.onclick=()=>{add('cinna',1);add('puri',2);say('ふたりとも うれしそうにおやつをたべています。')};pet.onclick=()=>{let c=Math.random()>.5?'cinna':'puri';add(c,2);say(c==='cinna'?'しなもろーる「えへへ♪」':'ポムポムぷりん「もっとなでて〜。」')};const lines={cinna:{day:'きょうはのんびりしたいきぶんなんだ。',food:'あまいものってしあわせなきぶんになるよね。',dream:'そらをずっととんでいけるゆめをみたんだ。',friend:'いっしょにいられてうれしいよ。'},puri:{day:'きょうはおひるねにちょうどいいひだね〜。',food:'ぷりんのお話ならいくらでもできるよ〜。',dream:'大きなぷりんの
