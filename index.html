function addBlock(shape,color,x,y){const d=document.createElement('div');d.className='block-piece '+shape;d.style.setProperty('--block-color',color);if(shape!=='triangle')d.style.background=color;let px=x==null?Math.max(4,stage.clientWidth/2-29):x,py=y==null?Math.max(4,stage.clientHeight-70):y;const draw=()=>{d.style.transform='translate3d('+px+'px,'+py+'px,0)'};draw();d.style.zIndex=++z;stage.appendChild(d);let drag=false,ox=0,oy=0,raf=0,nx=px,ny=py;d.onpointerdown=e=>{drag=true;d.setPointerCapture(e.pointerId);const r=d.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;d.style.zIndex=++z};d.onpointermove=e=>{if(!drag)return;const r=stage.getBoundingClientRect(),w=d.offsetWidth,h=d.offsetHeight;nx=Math.max(0,Math.min(stage.clientWidth-w,e.clientX-r.left-ox));ny=Math.max(0,Math.min(stage.clientHeight-h,e.clientY-r.top-oy));if(!raf)raf=requestAnimationFrame(()=>{raf=0;px=nx;py=ny;draw()})};const end=()=>{drag=false;if(raf){cancelAnimationFrame(raf);raf=0;px=nx;py=ny;draw()}};d.onpointerup=end;d.onpointercancel=end;d.onlostpointercapture=end}
fullChoices.querySelectorAll('.block-add').forEach(b=>b.onclick=()=>addBlock(b.dataset.shape,b.dataset.c));fullChoices.querySelector('.block-clear').onclick=()=>stage.innerHTML='';fullChoices.querySelector('.block-challenge').onclick=()=>{stage.innerHTML='';const w=stage.clientWidth,h=stage.clientHeight;addBlock('rect','#438be0',w/2-92,h-50);addBlock('square','#e95a4f',w/2-58,h-108);addBlock('square','#e95a4f',w/2+2,h-108);addBlock('triangle','#f2c84b',w/2-34,h-166);addBlock('circle','#72bd68',w/2+62,h-62);fullText.textContent='おうちと きの かたちを まねしてみよう！'}}
function closeTown(){full.classList.remove('show');document.body.style.overflow='';fullImg.style.height='';tip.textContent='どこに いこうかな？'}
home.onclick=closeTown;
})();
