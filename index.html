(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='cinna-puri-v031';let st=JSON.parse(localStorage.getItem(KEY)||'{"coins":30,"f":{"cinna":0,"puri":0},"wear":"✨"}'),who='cinna',timer=null,score=0,sec=15;const save=()=>localStorage.setItem(KEY,JSON.stringify(st));function render(){coins.textContent=st.coins;for(const c of ['cinna','puri']){let v=st.f[c],s=c==='cinna'?'c':'p';$('#l'+s).textContent='Lv.'+(Math.floor(v/50)+1);$('#b'+s).style.width=((v%50)/50*100)+'%'}}function add(c,n){st.f[c]+=n;save();render()}function say(t){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),2000)}$$('.nav').forEach(b=>b.onclick=()=>{$$('.nav').forEach(x=>x.classList.toggle('active',x===b));$$('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});$$('[data-go]').forEach(b=>b.onclick=()=>$('.nav[data-tab="'+b.dataset.go+'"]').click());$$('.char').forEach(b=>b.onclick=()=>{let c=b.dataset.char;say(c==='cinna'?'シナモロール「呼んだ？ いっしょに遊ぼう♪」':'ポムポムプリン「どうしたの〜？ おやつ食べる？」');add(c,1)});snack.onclick=()=>{add('cinna',1);add('puri',2);say('ふたりとも嬉しそうにおやつを食べています。')};pet.onclick=()=>{let c=Math.random()>.5?'cinna':'puri';add(c,2);say(c==='cinna'?'シナモロール「えへへ♪」':'ポムポムプリン「もっとなでて〜。」')};const lines={cinna:{day:'今日はのんびりしたい気分なんだ。',food:'甘いものって幸せな気分になるよね。',dream:'空をずっと飛んでいける夢を見たんだ。',friend:'いっしょにいられて嬉しいよ。'},puri:{day:'今日はおひるねにちょうどいい日だね〜。',food:'プリンのお話ならいくらでもできるよ〜。',dream:'大きなプリンのベッドで寝る夢を見たよ。',friend:'これからもたくさん遊ぼうね。'}};$$('.talkwho').forEach(b=>b.onclick=()=>{who=b.dataset.who;$$('.talkwho').forEach(x=>x.classList.toggle('selected',x===b))});$$('.topic').forEach(b=>b.onclick=()=>{talkText.textContent=lines[who][b.dataset.topic];add(who,3)});$$('.life').forEach(b=>b.onclick=()=>{let n=+b.dataset.n;add('cinna',n);add('puri',n);lifeMsg.textContent='ふたりと楽しく過ごしました。'});$$('.gift').forEach(b=>b.onclick=()=>{let p=+b.dataset.p;if(st.coins<p){lifeMsg.textContent='コインが足りません。';return}st.coins-=p;add(who,5);lifeMsg.textContent='とても喜んでくれました！'});$$('.wear').forEach(b=>b.onclick=()=>{st.wear=b.dataset.icon;save();render()});function spawn(){game.innerHTML='';let b=document.createElement('button');b.className='treat';b.textContent=Math.random()>.5?'🍪':'🍬';b.style.left=Math.random()*Math.max(1,game.clientWidth-54)+'px';b.style.top=Math.random()*Math.max(1,game.clientHeight-54)+'px';b.onclick=()=>{score++;$('#score').textContent=score;spawn()};game.appendChild(b)}start.onclick=()=>{if(timer)return;score=0;sec=15;$('#score').textContent=0;$('#sec').textContent=15;spawn();timer=setInterval(()=>{sec--;$('#sec').textContent=sec;if(sec<=0){clearInterval(timer);timer=null;game.innerHTML='';st.coins+=score;save();render();gameMsg.textContent='おしまい！ '+score+'コイン獲得しました。'}},1000)};let h=new Date().getHours();timeMsg.textContent=h<10?'おはようございます。ふたりも起きてきました。':h>=20?'夜のおへや。ふたりとも少し眠そうです。':'ふたりとも元気に過ごしています。';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
