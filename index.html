(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='cinna-puri-v031';let st=JSON.parse(localStorage.getItem(KEY)||'{"coins":30,"f":{"cinna":0,"puri":0},"wear":""}');st.imageOutfits=st.imageOutfits||{cinna:'',puri:''};let who='cinna',dressWho='cinna',timer=null,score=0,sec=15;const save=()=>localStorage.setItem(KEY,JSON.stringify(st));function render(){coins.textContent=st.coins;$('.roomoutfit').forEach(x=>x.remove());for(const c of ['cinna','puri']){const o=st.outfits[c];for(const cat of ['hat','clothes','shoes']){if(!o[cat])continue;let w=document.createElement('div');w.className='roomoutfit '+cat+' '+c;if(cat==='clothes'){w.style.background=o[cat].split('|')[0];w.textContent=o[cat].split('|')[1]}else w.textContent=cat==='shoes'?o[cat]+o[cat]:o[cat];$('.room').appendChild(w)}}for(const c of ['cinna','puri']){let v=st.f[c],s=c==='cinna'?'c':'p';$('#l'+s).textContent='れべる '+(Math.floor(v/50)+1);$('#b'+s).style.width=((v%50)/50*100)+'%'}}function add(c,n){st.f[c]+=n;save();render()}function say(t){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),2000)}$$('.nav').forEach(b=>b.onclick=()=>{$$('.nav').forEach(x=>x.classList.toggle('active',x===b));$$('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});$$('[data-go]').forEach(b=>b.onclick=()=>$('.nav[data-tab="'+b.dataset.go+'"]').click());$$('.char').forEach(b=>b.onclick=()=>{let c=b.dataset.char;say(c==='cinna'?'しなもろーる「よんだ？ いっしょにあそぼう♪」':'ぽむぽむぷりん「どうしたの〜？ おやつたべる？」');add(c,1)});food.onclick=()=>{mealpick.classList.add('show')};mealpick.onclick=e=>{const b=e.target.closest('.mealfood');if(!b)return;e.preventDefault();e.stopPropagation();mealpick.classList.remove('show');const fx=document.createElement('div');fx.className='foodfx';fx.textContent=b.dataset.food;document.querySelector('.room').appendChild(fx);cinnaImg.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(8px) scale(1.05)'},{transform:'trans
